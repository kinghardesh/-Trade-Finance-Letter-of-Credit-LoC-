# Used by tests annotated with @ActiveProfiles("test"):
# in-memory H2 database in PostgreSQL mode, same Flyway migrations as production.
spring.datasource.url=jdbc:h2:mem:loc;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# no Camunda needed for tests
camunda.client.deployment.enabled=false
camunda.client.worker.defaults.enabled=false
