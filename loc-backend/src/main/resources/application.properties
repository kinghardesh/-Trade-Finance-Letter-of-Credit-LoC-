spring.application.name=loc-backend

# Camunda 8 Run already uses port 8080, so the backend runs on 8081
server.port=8081

# ---------------------------------------------------------------
# Camunda 8 connection (local Camunda 8 Run, no authentication)
# ---------------------------------------------------------------
camunda.client.mode=self-managed
camunda.client.auth.method=none
camunda.client.grpc-address=http://localhost:26500
camunda.client.rest-address=http://localhost:8080
# Deploy every .bpmn in src/main/resources/bpmn at startup (see @Deployment on LocBackendApplication)
camunda.client.deployment.enabled=true

# ---------------------------------------------------------------
# PostgreSQL (docker/docker-compose.yml, container loc-postgres)
# ---------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5440/loc_issuance
spring.datasource.username=loc_app
spring.datasource.password=loc_app
# Flyway creates the tables (db/migration/V*.sql); Hibernate only CHECKS they match the entities
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# ---------------------------------------------------------------
# Mock credit bureau called by the BPMN REST connector.
# Sent to the process as variable "creditBureauUrl", so it follows server.port.
# ---------------------------------------------------------------
loc.credit-bureau.url=http://localhost:${server.port}/api/mock/credit-bureau/assessments

# ---------------------------------------------------------------
# Job workers: defaults for every @JobWorker
# ---------------------------------------------------------------
camunda.client.worker.defaults.max-jobs-active=16
camunda.client.worker.defaults.timeout=PT30S

# ---------------------------------------------------------------
# Frontend (React + Vite dev server) allowed to call /api/**
# ---------------------------------------------------------------
loc.cors.allowed-origins=http://localhost:5173

# Write dates as "2026-12-15" instead of numbers
spring.jackson.serialization.write-dates-as-timestamps=false
